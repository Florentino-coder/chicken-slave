# One instance only: room state lives in memory (see README "Scaling").
services:
  - type: web
    name: chicken-slave
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated web origins allowed to open sockets, e.g. https://chicken-slave.vercel.app
      # Leave empty when players use the Render URL directly.
      - key: ALLOWED_ORIGINS
        sync: false
      # 1 = Render's proxy only. Use 2 when the web app is on Vercel (Vercel edge + Render proxy).
      - key: TRUST_PROXY
        value: "1"
